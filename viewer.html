<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>LocalCipher Full‑View</title>
<style>
*{margin:0;padding:0;box‑sizing:border‑box;}
body{background:#0b0d12;color:#e5e7eb;padding:16px;min‑height:100vh;}
.container{max‑width:1200px;margin:0 auto;}
h2{margin‑bottom:12px;}
#viewBox{width:100%;}
pre{white‑space:pre‑wrap;font‑size:14px;line‑height:1.5;}
img{max‑width:100%;}
video,audio{width:100%;}
.info{color:#aaa;margin‑bottom:10px;}
</style>
</head>
<body>
<div class="container">
    <h2>Full‑Size Preview</h2>
    <div class="info" id="fileInfo"></div>
    <div id="viewBox"></div>
</div>

<script>
const box = document.getElementById("viewBox");
const infoDom = document.getElementById("fileInfo");

window.onload = ()=>{
    const b64 = localStorage.getItem("lc_view_data");
    const fname = localStorage.getItem("lc_view_name");
    if(!b64||!fname){
        box.innerText="No preview data, return to index.html and decrypt file first.";
        return;
    }
    infoDom.textContent = `File: ${fname}`;
    const raw = atob(b64);
    const uint8 = new Uint8Array([...raw].map(c=>c.charCodeAt(0)));
    const ext = fname.split('.').pop().toLowerCase();
    const blob = new Blob([uint8]);
    const url = URL.createObjectURL(blob);

    if(["jpg","jpeg","png","gif","bmp","webp"].includes(ext)){
        const img = document.createElement("img");
        img.src=url;
        box.appendChild(img);
    }else if(["mp3","wav","ogg","flac"].includes(ext)){
        const aud = document.createElement("audio");
        aud.controls=true;aud.src=url;
        box.appendChild(aud);
    }else if(["mp4","webm","mov"].includes(ext)){
        const vid = document.createElement("video");
        vid.controls=true;vid.src=url;
        box.appendChild(vid);
    }else if(["txt","log","md","csv","json"].includes(ext)){
        const text = new TextDecoder("utf‑8",{fatal:false}).decode(uint8);
        const pre = document.createElement("pre");
        pre.textContent=text;
        box.appendChild(pre);
    }else{
        box.innerHTML="<div>Binary file, cannot render preview.</div>";
    }
};
</script>
</body>
</html>
