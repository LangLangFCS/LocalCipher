<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial‑scale=1.0">
<title>Full File Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f1117;color:#eee;padding:16px}
pre{white‑space:pre‑wrap;font‑size:14px;line‑height:1.5}
img{max‑width:100%}
audio,video{width:100%;margin:8px 0}
.info{margin‑bottom:12px;color:#aaa}
</style>
</head>
<body>
<div class="info" id="fileInfo"></div>
<div id="box"></div>
<script>
const b64 = localStorage.getItem("lc_view_data");
const fname = localStorage.getItem("lc_view_name");
document.getElementById("fileInfo").textContent = "File: "+fname;
if(!b64){
    document.getElementById("box").innerText="No data";
}else{
    const bytes = Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ext = fname.split('.').pop().toLowerCase();
    const box = document.getElementById("box");
    const blob = new Blob([bytes]);
    const url = URL.createObjectURL(blob);
    if(["jpg","jpeg","png","gif","bmp","webp"].includes(ext)){
        const img = document.createElement("img");img.src=url;box.appendChild(img);
    }else if(["mp3","wav","ogg","flac"].includes(ext)){
        const aud=document.createElement("audio");aud.controls=true;aud.src=url;box.appendChild(aud);
    }else if(["mp4","webm","mov"].includes(ext)){
        const vid=document.createElement("video");vid.controls=true;vid.src=url;box.appendChild(vid);
    }else{
        const txt = new TextDecoder("utf‑8",{fatal:false}).decode(bytes);
        const pre = document.createElement("pre");pre.textContent=txt;box.appendChild(pre);
    }
}
</script>
</body>
</html>
