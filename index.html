<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalCipher Standalone</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, -apple-system, sans-serif;
}
body{
    background:#0f1117;
    color:#e5e7eb;
    padding:24px 16px;
    min-height:100vh;
}
.wrap{
    max-width:660px;
    margin:0 auto;
}
h1{
    text-align:center;
    font-size:22px;
    margin-bottom:16px;
}
.card{
    background:#181b23;
    border:1px solid #272b35;
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
}
h3{
    margin-bottom:12px;
    font-size:16px;
}
.radio-row{
    display:flex;
    gap:28px;
    margin-bottom:14px;
    flex-wrap:wrap;
}
.radio-item{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
}
.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    margin-bottom:10px;
    cursor:pointer;
}
.btn:disabled{
    background:#2d323d;
    color:#999;
    cursor:not-allowed;
}
.msg{
    min-height:28px;
    text-align:center;
    color:#93c5fd;
    margin:10px 0;
}
.err{
    color:#ff7878;
}
#fileEnc, #fileDec{
    position:absolute;
    opacity:0;
    width:1px;
    height:1px;
    overflow:hidden;
}
.preview{
    background:#121620;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
    display:none;
}
.preview img{
    max-width:100%;
}
.mode-tip{
    font-size:13px;
    color:#aaaaaa;
    margin-bottom:8px;
}
</style>
</head>
<body>
<div class="wrap">
<h1>LocalCipher</h1>

<div class="card">
<h3>选择编码模式</h3>
<div class="radio-row">
    <div class="radio-item">
        <input type="radio" name="mode" id="m16" value="16" checked>
        <label for="m16">16色 (4bit)</label>
    </div>
    <div class="radio-item">
        <input type="radio" name="mode" id="m64" value="64">
        <label for="m64">64色 (6bit)</label>
    </div>
</div>
<div class="mode-tip" id="modeTip">16色：兼容性优先</div>
</div>

<div class="card">
<h3>编码 文件→PNG</h3>
<input type="file" id="fileEnc">
<label for="fileEnc" class="btn" id="labEnc">选择文件</label>
<button class="btn" id="btnEnc">编码并下载PNG</button>
</div>

<div class="card">
<h3>解码 PNG→原文件</h3>
<input type="file" id="fileDec" accept=".png">
<label for="fileDec" class="btn" id="labDec">选择PNG图片</label>
<button class="btn" id="btnDec">解码恢复文件</button>
</div>

<div class="preview" id="previewBox">
<img id="prevImg">
</div>
<div class="msg" id="msgBox"></div>
</div>

<canvas id="cvsWork" style="display:none"></canvas>
<canvas id="cvsMirror" style="display:none"></canvas>

<script>
const $ = s=>document.querySelector(s);
const fileEnc = $("#fileEnc");
const fileDec = $("#fileDec");
const labEnc = $("#labEnc");
const labDec = $("#labDec");
const btnEnc = $("#btnEnc");
const btnDec = $("#btnDec");
const msgBox = $("#msgBox");
const previewBox = $("#previewBox");
const prevImg = $("#prevImg");
const cvsWork = $("#cvsWork");
const ctxWork = cvsWork.getContext("2d");
const cvsMirror = $("#cvsMirror");
const ctxMirror = cvsMirror.getContext("2d");
const modeTip = $("#modeTip");

const DEF_ENC = "选择文件";
const DEF_DEC = "选择PNG图片";

function toast(text,isError){
    msgBox.textContent = text;
    msgBox.className = "msg" + (isError?" err":"");
}
function shortName(n){
    if(n.length<=22) return n;
    const dot = n.lastIndexOf(".");
    if(dot<0) return n.slice(0,19)+"…";
    return n.slice(0,18)+"…"+n.slice(dot);
}

fileEnc.onchange = function(){
    labEnc.textContent = this.files.length? shortName(this.files[0].name):DEF_ENC;
};
fileDec.onchange = function(){
    labDec.textContent = this.files.length? shortName(this.files[0].name):DEF_DEC;
};

// 获取当前模式
function getMode(){
    return document.querySelector('input[name="mode"]:checked').value;
}
// 调色板
function makePalette(mode){
    let p=[];
    if(mode==="16"){
        for(let i=0;i<16;i++) p.push({r:(i&0x03)*85,g:((i>>2)&0x03)*85,b:0});
        modeTip.textContent="16色(4bit)：兼容性优先";
    }else{
        for(let i=0;i<64;i++) p.push({r:(i&0x07)*36,g:((i>>3)&0x07)*36,b:0});
        modeTip.textContent="64色(6bit)：图片体积更小";
    }
    return p;
}
document.querySelectorAll('input[name="mode"]').forEach(r=>r.addEventListener('change',()=>makePalette(getMode())));

// 打包：[文件名长度2字节][文件名][文件二进制]
function buildPayload(filename, bin){
    const nameRaw = new TextEncoder().encode(filename);
    const out = new Uint8Array(2 + nameRaw.length + bin.length);
    out[0] = nameRaw.length >> 8;
    out[1] = nameRaw.length & 0xff;
    out.set(nameRaw,2);
    out.set(bin, 2+nameRaw.length);
    return out;
}
function parsePayload(buf){
    const nameLen = (buf[0]<<8)|buf[1];
    const name = new TextDecoder().decode(buf.slice(2,2+nameLen));
    const data = buf.slice(2+nameLen);
    return {name,data};
}

// 镜像+交换行1与17
function postProcess(canvas){
    const w=canvas.width, h=canvas.height;
    cvsMirror.width=w; cvsMirror.height=h;
    ctxMirror.save();
    ctxMirror.translate(w,0);
    ctxMirror.scale(-1,1);
    ctxMirror.drawImage(canvas,0,0);
    ctxMirror.restore();

    const img = ctxMirror.getImageData(0,0,w,h);
    const d = img.data;
    if(h>17){
        const r1 = w*4, r17 = 17*w*4;
        for(let i=0;i<w*4;i++){
            let t=d[r1+i]; d[r1+i]=d[r17+i]; d[r17+i]=t;
        }
    }
    ctxMirror.putImageData(img,0,0);
    return cvsMirror;
}

// 字节转bit流
function bytesToBits(arr,mode){
    let stream=[];
    if(mode==="16"){
        for(let b of arr){
            stream.push((b>>4)&0x0F);
            stream.push(b&0x0F);
        }
    }else{
        let acc=0, cnt=0;
        for(let b of arr){
            acc = (acc<<8)|b;
            cnt +=8;
            while(cnt>=6){
                cnt -=6;
                stream.push((acc>>cnt)&0x3F);
            }
        }
        stream.unshift(cnt);
    }
    return stream;
}
// bit流转字节
function bitsToBytes(stream,mode){
    let out=[];
    if(mode==="16"){
        for(let i=0;i<stream.length;i+=2){
            const hi=stream[i], lo=stream[i+1];
            out.push((hi<<4)|lo);
        }
    }else{
        const pad=stream[0];
        const data=stream.slice(1);
        let acc=0,cnt=0;
        for(let v of data){
            acc=(acc<<6)|v;
            cnt+=6;
            while(cnt>=8){
                cnt -=8;
                out.push((acc>>cnt)&0xFF);
            }
        }
        if(pad>0) out.pop();
    }
    return new Uint8Array(out);
}

btnEnc.onclick = async function(){
    const f = fileEnc.files[0];
    if(!f) return toast("请先选择文件",true);
    btnEnc.disabled=true; btnEnc.textContent="编码中…"; toast("");
    try{
        const mode = getMode();
        const palette = makePalette(mode);
        const arr = new Uint8Array(await f.arrayBuffer());
        const payload = buildPayload(f.name, arr);
        const bitStream = bytesToBits(payload, mode);

        const side = Math.ceil(Math.sqrt(bitStream.length));
        cvsWork.width=side; cvsWork.height=side;
        ctxWork.clearRect(0,0,side,side);

        for(let i=0;i<bitStream.length;i++){
            const c = palette[bitStream[i]];
            const x = i%side;
            const y = Math.floor(i/side);
            ctxWork.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
            ctxWork.fillRect(x,y,1,1);
        }
        const final = postProcess(cvsWork);
        const blob = await new Promise(r=>final.toBlob(r,"image/png"));
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href=url; a.download=f.name+"."+mode+"c.png";
        document.body.appendChild(a); a.click(); a.remove();

        prevImg.src=url; previewBox.style.display="block";
        toast("编码完成");
    }catch(e){
        toast("编码失败："+e.message,true);
        console.error(e);
    }finally{
        btnEnc.disabled=false; btnEnc.textContent="编码并下载PNG";
    }
};

btnDec.onclick = async function(){
    const f = fileDec.files[0];
    if(!f) return toast("请先选择PNG",true);
    btnDec.disabled=true; btnDec.textContent="解码中…"; toast("");
    try{
        const mode = getMode();
        const palette = makePalette(mode);
        const img = new Image();
        await new Promise((ok,err)=>{img.onload=ok;img.onerror=err;img.src=URL.createObjectURL(f);});
        const w=img.width, h=img.height;
        cvsWork.width=w; cvsWork.height=h;
        ctxWork.drawImage(img,0,0);

        //镜像复原
        cvsMirror.width=w; cvsMirror.height=h;
        ctxMirror.save();
        ctxMirror.translate(w,0); ctxMirror.scale(-1,1);
        ctxMirror.drawImage(cvsWork,0,0);
        ctxMirror.restore();
        const revData = ctxMirror.getImageData(0,0,w,h).data;

        //交换行1与17复原
        if(h>17){
            const r1 = w*4, r17 = 17*w*4;
            for(let i=0;i<w*4;i++){
                let t=revData[r1+i]; revData[r1+i]=revData[r17+i]; revData[r17+i]=t;
            }
        }
        //取像素匹配调色板得到索引流
        const bitStream=[];
        for(let p=0;p<revData.length;p+=4){
            const r=revData[p],g=revData[p+1],b=revData[p+2];
            let best=0,minD=1e9;
            for(let idx=0;idx<palette.length;idx++){
                const c=palette[idx];
                const d=(r‑c.r)**2+(g‑c.g)**2+(b‑c.b)**2;
                if(d<minD){minD=d;best=idx;}
            }
            bitStream.push(best);
        }
        const rawBuf = bitsToBytes(bitStream,mode);
        const res = parsePayload(rawBuf);
        const blob = new Blob([res.data]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href=url; a.download=res.name;
        document.body.appendChild(a); a.click(); a.remove();

        prevImg.src=img.src; previewBox.style.display="block";
        toast("解码完成："+res.name);
    }catch(e){
        toast("解码失败："+e.message,true);
        console.error(e);
    }finally{
        btnDec.disabled=false; btnDec.textContent="解码恢复文件";
    }
};
