<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalCipher 16色 standalone</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, -apple-system, sans-serif;
}
body{
    background:#0f1117;
    color:#e5e7eb;
    padding:24px 16px;
    min-height:100vh;
}
.wrap{
    max-width:660px;
    margin:0 auto;
}
h1{
    text-align:center;
    font-size:22px;
    margin-bottom:16px;
}
.card{
    background:#181b23;
    border:1px solid #272b35;
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
}
h3{
    margin-bottom:12px;
    font-size:16px;
}
.btn{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}
.btn:disabled{
    background:#2d323d;
    color:#999;
    cursor:not-allowed;
}
.btn-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}
.btn-auto{
    flex:1 1 140px;
    min-width:140px;
}
.msg{
    min-height:28px;
    text-align:center;
    color:#93c5fd;
    margin:10px 0;
}
.err{
    color:#ff7878;
}
#fileEnc, #fileDec{
    position:absolute;
    opacity:0;
    width:1px;
    height:1px;
    overflow:hidden;
}
.preview{
    background:#121620;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
    display:none;
}
.preview img{
    max-width:100%;
}
</style>
</head>
<body>
<div class="wrap">
<h1>LocalCipher 16色(4bit)</h1>

<div class="card">
<h3>编码 文件→PNG</h3>
<input type="file" id="fileEnc">
<div class="btn-row">
    <label for="fileEnc" class="btn btn-auto" id="labEnc">选择文件</label>
    <button class="btn btn-auto" id="btnEnc">编码并下载PNG</button>
</div>
</div>

<div class="card">
<h3>解码 PNG→原文件</h3>
<input type="file" id="fileDec" accept=".png">
<div class="btn-row">
    <label for="fileDec" class="btn btn-auto" id="labDec">选择PNG图片</label>
    <button class="btn btn-auto" id="btnDec">解码恢复文件</button>
</div>
</div>

<div class="preview" id="previewBox">
<img id="prevImg">
</div>
<div class="msg" id="msgBox"></div>
</div>

<canvas id="cvsWork" style="display:none"></canvas>
<canvas id="cvsMirror" style="display:none"></canvas>

<script>
const $ = s=>document.querySelector(s);
const fileEnc = $("#fileEnc");
const fileDec = $("#fileDec");
const labEnc = $("#labEnc");
const labDec = $("#labDec");
const btnEnc = $("#btnEnc");
const btnDec = $("#btnDec");
const msgBox = $("#msgBox");
const previewBox = $("#previewBox");
const prevImg = $("#prevImg");
const cvsWork = $("#cvsWork");
const ctxWork = cvsWork.getContext("2d");
const cvsMirror = $("#cvsMirror");
const ctxMirror = cvsMirror.getContext("2d");

const DEF_ENC = "选择文件";
const DEF_DEC = "选择PNG图片";

function toast(text,isError){
    msgBox.textContent = text;
    msgBox.className = "msg" + (isError?" err":"");
}
function shortName(n){
    if(n.length<=22) return n;
    const dot = n.lastIndexOf(".");
    if(dot<0) return n.slice(0,19)+"…";
    return n.slice(0,18)+"…"+n.slice(dot);
}

fileEnc.onchange = function(){
    labEnc.textContent = this.files.length? shortName(this.files[0].name):DEF_ENC;
};
fileDec.onchange = function(){
    labDec.textContent = this.files.length? shortName(this.files[0].name):DEF_DEC;
};

//16色调色板 i:0‑15，R=i*16 G=0 B=0
function makePalette(){
    const p = [];
    for(let i=0;i<16;i++){
        p.push({r:i*16, g:0, b:0});
    }
    return p;
}
const palette = makePalette();

//打包：[文件名长度2字节][文件名][文件二进制]
function buildPayload(filename, bin){
    const nameRaw = new TextEncoder().encode(filename);
    const out = new Uint8Array(2 + nameRaw.length + bin.length);
    out[0] = nameRaw.length >> 8;
    out[1] = nameRaw.length & 0xff;
    out.set(nameRaw,2);
    out.set(bin, 2+nameRaw.length);
    return out;
}
function parsePayload(buf){
    const nameLen = (buf[0]<<8)|buf[1];
    const name = new TextDecoder().decode(buf.slice(2,2+nameLen));
    const data = buf.slice(2+nameLen);
    return {name,data};
}

//水平镜像翻转
function postProcess(canvas){
    const w=canvas.width, h=canvas.height;
    cvsMirror.width=w; cvsMirror.height=h;
    ctxMirror.save();
    ctxMirror.translate(w,0);
    ctxMirror.scale(-1,1);
    ctxMirror.drawImage(canvas,0,0);
    ctxMirror.restore();
    return cvsMirror;
}

//Uint8Array →4bit索引流，头部存放填充bit数量
function bytesTo4BitStream(arr){
    let acc = 0;
    let bitCnt = 0;
    const stream = [];
    for(const b of arr){
        acc = (acc << 8) | b;
        bitCnt += 8;
        while(bitCnt >=4){
            bitCnt -=4;
            stream.push( (acc >> bitCnt) & 0x0F );
        }
    }
    stream.unshift(bitCnt);
    return stream;
}

//4bit索引流转回Uint8Array，丢弃头部填充比特
function fourBitStreamToBytes(stream){
    const pad = stream[0];
    const data = stream.slice(1);
    let acc = 0;
    let bitCnt = 0;
    const out = [];
    for(const v of data){
        acc = (acc <<4) | v;
        bitCnt +=4;
        while(bitCnt >=8){
            bitCnt -=8;
            out.push( (acc >> bitCnt) & 0xFF );
        }
    }
    if(pad>0){
        const remain = bitCnt - pad;
        if(remain>0){
            acc = acc >> remain;
            out.push(acc &0xFF);
        }
    }
    return new Uint8Array(out);
}

btnEnc.onclick = async function(){
    const f = fileEnc.files[0];
    if(!f) return toast("请先选择文件",true);
    btnEnc.disabled=true; toast("");
    try{
        const arr = new Uint8Array(await f.arrayBuffer());
        const payload = buildPayload(f.name, arr);
        const bitStream = bytesTo4BitStream(payload);

        const side = Math.ceil(Math.sqrt(bitStream.length));
        cvsWork.width=side; cvsWork.height=side;
        ctxWork.clearRect(0,0,side,side);

        for(let i=0;i<bitStream.length;i++){
            const c = palette[bitStream[i]];
            const x = i%side;
            const y = Math.floor(i/side);
            ctxWork.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
            ctxWork.fillRect(x,y,1,1);
        }
        const final = postProcess(cvsWork);
        const blob = await new Promise(r=>final.toBlob(r,"image/png"));
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href=url; a.download=f.name+".16c.png";
        document.body.appendChild(a); a.click(); a.remove();

        prevImg.src=url; previewBox.style.display="block";
        toast("编码完成");
    }catch(e){
        toast("编码失败："+e.message,true);
        console.error(e);
    }finally{
        btnEnc.disabled=false;
    }
};

btnDec.onclick = async function(){
    const f = fileDec.files[0];
    if(!f) return toast("请先选择PNG",true);
    btnDec.disabled=true; toast("");
    try{
        const img = new Image();
        await new Promise((ok,err)=>{img.onload=ok;img.onerror=err;img.src=URL.createObjectURL(f);});
        const w=img.width, h=img.height;
        cvsWork.width=w; cvsWork.height=h;
        ctxWork.drawImage(img,0,0);

        //镜像复原
        cvsMirror.width=w; cvsMirror.height=h;
        ctxMirror.save();
        ctxMirror.translate(w,0); ctxMirror.scale(-1,1);
        ctxMirror.drawImage(cvsWork,0,0);
        ctxMirror.restore();
        const revData = ctxMirror.getImageData(0,0,w,h).data;

        const bitStream=[];
        for(let p=0;p<revData.length;p+=4){
            const r=revData[p],g=revData[p+1],b=revData[p+2];
            let best=0,minD=1e9;
            for(let idx=0;idx<palette.length;idx++){
                const c=palette[idx];
                const d=(r-c.r)*(r-c.r)+(g-c.g)*(g-c.g)+(b-c.b)*(b-c.b);
                if(d<minD){minD=d;best=idx;}
            }
            bitStream.push(best);
        }

        const rawBuf = fourBitStreamToBytes(bitStream);
        const res = parsePayload(rawBuf);
        const blob = new Blob([res.data]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href=url; a.download=res.name;
        document.body.appendChild(a); a.click(); a.remove();

        prevImg.src=img.src; previewBox.style.display="block";
        toast("解码完成："+res.name);
    }catch(e){
        toast("解码失败："+e.message,true);
        console.error(e);
    }finally{
        btnDec.disabled=false;
    }
};
</script>
</body>
</html>
