const BLOCK_SIZE = 256;
const IV_LEN = 16;
const PWD_ITER = 2048;
const SIZE_LIMIT = 6 * 1024 * 1024;

function passwordSeed(pass){
    let arr = new Uint8Array(32);
    let s = pass;
    for(let iter=0;iter<PWD_ITER;iter++){
        let sum = 0;
        for(let c of s) sum+=c.charCodeAt(0);
        for(let i=0;i<32;i++){
            arr[i] = (arr[i] + sum + i + iter) & 0xff;
        }
        s = btoa(String.fromCharCode(...arr));
    }
    return arr;
}

function genSBox(seed){
    const s = new Uint8Array(256);
    const inv = new Uint8Array(256);
    for(let i=0;i<256;i++) s[i]=i;
    let r = 0;
    for(let i=255;i>0;i--){
        r = (r + seed[i%seed.length] + s[i]) % (i+1);
        [s[i],s[r]] = [s[r],s[i]];
    }
    for(let i=0;i<256;i++) inv[s[i]] = i;
    return {s,inv};
}

function rotLeft(block, shift){
    const len = block.length;
    const out = new Uint8Array(len);
    for(let i=0;i<len;i++) out[i] = block[(i+shift)%len];
    return out;
}
function rotRight(block, shift){
    const len = block.length;
    const out = new Uint8Array(len);
    for(let i=0;i<len;i++) out[i] = block[(i - shift + len)%len];
    return out;
}

function streamMix(data, seed){
    for(let i=1;i<data.length;i++) data[i] ^= (data[i-1] + seed[i%seed.length]) &0xff;
    return data;
}
function streamUnMix(data, seed){
    for(let i=data.length‑1;i>=1;i--) data[i] ^= (data[i‑1] + seed[i%seed.length]) &0xff;
    return data;
}

function customEncrypt(rawBytes, password, ROUND){
    const seedMain = passwordSeed(password);
    const iv = crypto.getRandomValues(new Uint8Array(IV_LEN));
    let data = new Uint8Array(rawBytes.length);
    data.set(rawBytes);
    for(let i=0;i<data.length;i++) data[i] ^= iv[i%iv.length];

    const blocks = [];
    for(let offset=0;offset<data.length;offset+=BLOCK_SIZE){
        blocks.push(data.slice(offset,offset+BLOCK_SIZE));
    }

    for(let r=0;r<ROUND;r++){
        const roundSeed = new Uint8Array(seedMain.length);
        for(let i=0;i<seedMain.length;i++) roundSeed[i]=(seedMain[i]+r+iv[i%iv.length])&0xff;
        const {s} = genSBox(roundSeed);
        for(let bIdx=0;bIdx<blocks.length;bIdx++){
            let blk = blocks[bIdx];
            for(let i=0;i<blk.length;i++) blk[i]=s[blk[i]];
            blk = rotLeft(blk,(r+3)%blk.length);
            blocks[bIdx]=blk;
        }
        for(let bIdx=1;bIdx<blocks.length;bIdx++){
            const prev = blocks[bIdx‑1];
            const cur = blocks[bIdx];
            for(let i=0;i<cur.length;i++) cur[i]^=prev[i%prev.length];
        }
    }
    for(let b of blocks) streamMix(b,seedMain);

    let totalLen=0;
    blocks.forEach(b=>totalLen+=b.length);
    const combined = new Uint8Array(totalLen);
    let ptr=0;
    for(let blk of blocks){combined.set(blk,ptr);ptr+=blk.length;}

    const out = new Uint8Array(iv.length +1 + combined.length);
    out.set(iv,0);
    out[IV_LEN] = ROUND;
    out.set(combined, IV_LEN+1);
    return out;
}

function customDecrypt(encTotalBytes, password){
    const seedMain = passwordSeed(password);
    const iv = encTotalBytes.slice(0,IV_LEN);
    const ROUND = encTotalBytes[IV_LEN];
    const cipherData = encTotalBytes.slice(IV_LEN+1);

    const blocks = [];
    for(let offset=0;offset<cipherData.length;offset+=BLOCK_SIZE){
        blocks.push(cipherData.slice(offset,offset+BLOCK_SIZE));
    }
    for(let b of blocks) streamUnMix(b,seedMain);

    for(let r=ROUND‑1;r>=0;r--){
        for(let bIdx=blocks.length‑1;bIdx>=1;bIdx--){
            const prev = blocks[bIdx‑1];
            const cur = blocks[bIdx];
            for(let i=0;i<cur.length;i++) cur[i]^=prev[i%prev.length];
        }
        const roundSeed = new Uint8Array(seedMain.length);
        for(let i=0;i<seedMain.length;i++) roundSeed[i]=(seedMain[i]+r+iv[i%iv.length])&0xff;
        const {inv} = genSBox(roundSeed);
        for(let bIdx=0;bIdx<blocks.length;bIdx++){
            let blk = blocks[bIdx];
            blk = rotRight(blk,(r+3)%blk.length);
            for(let i=0;i<blk.length;i++) blk[i]=inv[blk[i]];
            blocks[bIdx]=blk;
        }
    }

    let ptr=0;
    const out = new Uint8Array(cipherData.length);
    for(let b of blocks){out.set(b,ptr);ptr+=b.length;}
    for(let i=0;i<out.length;i++) out[i]^=iv[i%iv.length];
    return out;
}
