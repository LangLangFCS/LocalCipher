<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalCipher PNG</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
body{
    min-height:100vh;
    background-color:#0f1117;
    color:#e5e7eb;
    padding:24px 16px;
}
.container{
    max-width:680px;
    margin:0 auto;
}
h1{
    font-size:26px;
    font-weight:600;
    margin-bottom:8px;
    text-align:center;
}
.subtitle{
    text-align:center;
    font-size:13px;
    color:#9ca3af;
    margin-bottom:12px;
}
.message{
    min-height:28px;
    margin-bottom:12px;
    text-align:center;
    color:#93c5fd;
    font-size:15px;
    font-weight:500;
}
.warn{
    color:#f87171;
}
.info{
    color:#60a5fa;
}
.card{
    background-color:#181b23;
    border:1px solid #272b35;
    border-radius:16px;
    padding:24px;
    margin-bottom:20px;
}
.card h3{
    font-size:18px;
    font-weight:500;
    margin-bottom:16px;
    color:#f3f4f6;
}
input[type="file"],
input[type="password"],
select{
    width:100%;
    padding:12px 14px;
    margin-bottom:14px;
    background:#21252e;
    border:1px solid #333844;
    border-radius:10px;
    color:#e5e7eb;
    font-size:15px;
}
input[type="file"]::file-selector-button {
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:6px;
    padding:8px 14px;
    cursor:pointer;
    margin-right:12px;
    transition:background 0.2s;
}
input[type="file"]::file-selector-button:hover {
    background:#1d4ed8;
}
input:focus,select:focus{
    outline:none;
    border-color:#3b82f6;
}
button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#ffffff;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.2s;
    margin-bottom:10px;
}
button:hover:not(:disabled){
    background:#1d4ed8;
}
button:disabled{
    background:#2d323d;
    color:#717885;
    cursor:not-allowed;
}
.tip-box{
    font-size:13px;
    padding:10px;
    border-radius:8px;
    background:#1e293b;
    margin-bottom:14px;
    line-height:1.5;
}
.preview-card{
    background:#121620;
    border:1px solid #2e3440;
    border-radius:12px;
    padding:16px;
    margin-top:14px;
    max-height:420px;
    overflow:auto;
}
.preview-card img{
    max-width:100%;
}
.preview-card pre{
    white-space:pre-wrap;
    font-size:13px;
    line-height:1.4;
}
@media(max-width:600px){
    h1{font-size:22px;}
    .card{padding:18px;}
}
</style>
</head>
<body>
<div class="container">
    <h1>LocalCipher PNG</h1>
    <div class="subtitle">File‑to‑16color image + mirror flip</div>
    <div class="message" id="msg"></div>
    <div class="tip-box" id="perfTip">Select file, generate 16‑color PNG with horizontal mirror flip.</div>

    <div class="card">
        <h3>File To Image</h3>
        <input type="file" id="fileInput">
        <button id="btnGen">Generate & Download PNG</button>
    </div>

    <div class="card">
        <h3>Preview</h3>
        <div class="preview-card" id="previewBox" style="display:none;">
            <div id="previewInner"></div>
        </div>
    </div>
</div>

<canvas id="workCanvas" style="display:none;"></canvas>

<script>
const msgEl = document.getElementById('msg');
const perfTip = document.getElementById('perfTip');
const previewBox = document.getElementById('previewBox');
const previewInner = document.getElementById('previewInner');
const canvas = document.getElementById('workCanvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const btnGen = document.getElementById('btnGen');

let lastPreviewUrl = null;

// 16种颜色，对应0‑F 16进制每4bit
const palette16 = [
    "#000000", "#1a1a2e", "#16213e", "#0f3460",
    "#533483", "#e94560", "#ff6b6b", "#ffd93d",
    "#6bcb77", "#4d96ff", "#9d65c9", "#ff9de2",
    "#48dbfb", "#1dd1a1", "#ff9f43", "#ffffff"
];

function toast(s, isWarn=false){
    msgEl.textContent = s;
    msgEl.className = isWarn ? "message warn" : "message info";
    void msgEl.offsetHeight;
}

function clearPreview(){
    if(lastPreviewUrl){
        URL.revokeObjectURL(lastPreviewUrl);
        lastPreviewUrl=null;
    }
    previewInner.innerHTML="";
    previewBox.style.display="none";
}

fileInput.addEventListener('change',()=>{
    const f = fileInput.files[0];
    if(!f){
        perfTip.innerText="Select file, generate 16‑color PNG with horizontal mirror flip.";
        return;
    }
    perfTip.innerText=`File: ${f.name} | ${(f.size/1024).toFixed(2)}KB`;
});

btnGen.onclick = async ()=>{
    clearPreview();
    const file = fileInput.files[0];
    if(!file){
        toast("Please choose a file",true);
        return;
    }
    btnGen.disabled = true;
    toast("Reading file…");
    try{
        const buf = await file.arrayBuffer();
        const uint = new Uint8Array(buf);

        // 把每个字节拆成高4bit、低4bit，每个取值0‑15
        const nibbles = [];
        for(let i=0;i<uint.length;i++){
            const b = uint[i];
            const hi = (b >> 4) & 0x0F;
            const lo = b & 0x0F;
            nibbles.push(hi, lo);
        }

        // 计算正方形画布边长
        const totalPixels = nibbles.length;
        const side = Math.ceil(Math.sqrt(totalPixels));
        canvas.width = side;
        canvas.height = side;
        ctx.clearRect(0,0,side,side);

        // 填充像素，取调色板颜色
        for(let idx=0;idx<totalPixels;idx++){
            const x = idx % side;
            const y = Math.floor(idx / side);
            const cIndex = nibbles[idx];
            ctx.fillStyle = palette16[cIndex];
            ctx.fillRect(x,y,1,1);
        }

        // ==========水平镜像反转==========
        ctx.save();
        ctx.scale(-1,1);
        ctx.drawImage(canvas, -side, 0, side, side);
        ctx.restore();

        // 导出PNG
        const pngUrl = canvas.toDataURL("image/png");
        const a = document.createElement('a');
        a.href = pngUrl;
        a.download = file.name + "_16color_mirror.png";
        document.body.appendChild(a);
        a.click();
        a.remove();

        // 预览
        const img = new Image();
        img.src = pngUrl;
        lastPreviewUrl = pngUrl;
        previewInner.appendChild(img);
        previewBox.style.display="block";
        toast("Generated done, downloaded");
    }catch(err){
        toast("Error: "+err.message,true);
        console.error(err);
    }finally{
        btnGen.disabled = false;
    }
};
</script>
</body>
</html>
