<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalCipher 图片载体编解码器</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
button:focus{
    outline:none !important;
}
body{
    min-height:100vh;
    background-color:#0f1117;
    color:#e5e7eb;
    padding:24px 16px;
}
.container{
    max-width:680px;
    margin:0 auto;
}
h1{
    font-size:24px;
    font-weight:600;
    margin-bottom:8px;
    text-align:center;
}
.subtitle{
    text-align:center;
    font-size:13px;
    color:#9ca3af;
    margin-bottom:16px;
}
.message{
    min-height:28px;
    margin-bottom:12px;
    text-align:center;
    color:#93c5fd;
    font-size:15px;
}
.warn{
    color:#f87171;
}
.card{
    background-color:#181b23;
    border:1px solid #272b35;
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
}
.card h3{
    font-size:17px;
    font-weight:500;
    margin-bottom:12px;
    color:#f3f4f6;
}
input[type="file"]{
    width:100%;
    padding:12px 14px;
    margin-bottom:12px;
    background:#21252e;
    border:1px solid #333844;
    border-radius:10px;
    color:#e5e7eb;
}
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#ffffff;
    font-size:15px;
    cursor:pointer;
    margin-bottom:10px;
}
button:hover:not(:disabled){
    background:#1d4ed8;
}
button:disabled{
    background:#2d323d;
    color:#717885;
    cursor:not-allowed;
}
.radio-wrap{
    display:flex;
    gap:24px;
    margin-bottom:12px;
}
.radio-item{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
}
.preview-card{
    background:#121620;
    border:1px solid #2e3440;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
    max-height:400px;
    overflow:auto;
}
.preview-card img{
    max-width:100%;
}
@media(max-width:600px){
    h1{font-size:20px;}
    .card{padding:16px;}
}
</style>
</head>
<body>
<div class="container">
    <h1>LocalCipher 图片载体编解码器</h1>
    <div class="subtitle">16色(4bit稳定)｜64色(6bit体积更小)｜水平镜像翻转</div>

    <div class="card">
        <h3>选择模式</h3>
        <div class="radio-wrap">
            <div class="radio-item">
                <input type="radio" name="mode" id="m16" value="16" checked onclick="updatePalette()">
                <label for="m16">16色 4bit（稳定优先）</label>
            </div>
            <div class="radio-item">
                <input type="radio" name="mode" id="m64" value="64" onclick="updatePalette()">
                <label for="m64">64色 6bit（体积更小）</label>
            </div>
        </div>
        <div id="modeTip" style="font-size:13px;color:#aaa;"></div>
    </div>

    <div class="card">
        <h3>编码 文件转为PNG图片</h3>
        <input type="file" id="encFile">
        <button id="btnEncode">编码并下载PNG</button>
    </div>

    <div class="card">
        <h3>解码 PNG恢复原文件</h3>
        <input type="file" id="decFile" accept=".png">
        <button id="btnDecode">解码并恢复文件</button>
    </div>

    <div class="card">
        <h3>预览</h3>
        <div class="preview-card" id="previewBox" style="display:none;">
            <img id="prevImg">
        </div>
    </div>

    <div class="message" id="msg"></div>
</div>

<canvas id="workCanvas" style="display:none;"></canvas>
<canvas id="mirrorCanvas" style="display:none;"></canvas>

<script>
const msgEl = document.getElementById('msg');
const previewBox = document.getElementById('previewBox');
const prevImg = document.getElementById('prevImg');
const canvas = document.getElementById('workCanvas');
const ctx = canvas.getContext('2d');
const mCanvas = document.getElementById('mirrorCanvas');
const mCtx = mCanvas.getContext('2d');
const encFile = document.getElementById('encFile');
const decFile = document.getElementById('decFile');
const btnEncode = document.getElementById('btnEncode');
const btnDecode = document.getElementById('btnDecode');
const modeTip = document.getElementById('modeTip');

let palette = [];

function getMode(){
    return document.querySelector('input[name="mode"]:checked').value;
}

window.updatePalette = function(){
    const mode = getMode();
    palette = [];
    if(mode === "16"){
        for(let i=0;i<16;i++){
            const r = (i & 0b11) * 85;
            const g = ((i>>2)&0b11)*85;
            const b = 0;
            palette.push({r,g,b});
        }
        modeTip.textContent = "16色(4bit):无填充位，解码稳定，图片尺寸偏大";
    }else{
        for(let i=0;i<64;i++){
            const r = (i & 0b111)*36;
            const g = ((i>>3)&0b111)*36;
            const b = 0;
            palette.push({r,g,b});
        }
        modeTip.textContent = "64色(6bit):图片更小，存在少量末尾填充比特";
    }
}
updatePalette();

function toast(s,isWarn=false){
    msgEl.textContent=s;
    msgEl.className= isWarn?"message warn":"message";
}

function findIndex(r,g,b){
    let best=0;
    let minD=1e9;
    for(let i=0;i<palette.length;i++){
        const c=palette[i];
        const dr=r-c.r;
        const dg=g-c.g;
        const db=b-c.b;
        const dist = dr*dr+dg*dg+db*db;
        if(dist<minD){
            minD=dist;
            best=i;
        }
    }
    return best;
}

btnEncode.onclick=async ()=>{
    const file = encFile.files[0];
    if(!file) return toast("请选择文件",true);
    btnEncode.disabled=true;
    toast("正在编码");
    try{
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        const mode = getMode();
        let bitStream=[];

        if(mode==="16"){
            for(const b of bytes){
                bitStream.push((b>>4)&0x0F);
                bitStream.push(b&0x0F);
            }
        }else{
            let acc=0;
            let bitCnt=0;
            for(const b of bytes){
                acc = (acc <<8) | b;
                bitCnt +=8;
                while(bitCnt >=6){
                    bitCnt -=6;
                    const val = (acc >> bitCnt) & 0x3F;
                    bitStream.push(val);
                }
            }
            const pad = bitCnt;
            bitStream.unshift(pad);
        }

        const total = bitStream.length;
        const side = Math.ceil(Math.sqrt(total));
        canvas.width=side; canvas.height=side;
        ctx.clearRect(0,0,side,side);

        for(let i=0;i<total;i++){
            const x = i % side;
            const y = Math.floor(i / side);
            const c = palette[bitStream[i]];
            ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
            ctx.fillRect(x,y,1,1);
        }

        mCanvas.width=side; mCanvas.height=side;
        mCtx.save();
        mCtx.scale(-1,1);
        mCtx.drawImage(canvas,-side,0,side,side);
        mCtx.restore();

        const blob = await new Promise(res=>mCanvas.toBlob(res,"image/png"));
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href=url;
        a.download = file.name + (mode==="16"?".16color.png":".64color.png");
        document.body.appendChild(a);
        a.click();
        a.remove();

        prevImg.src=url;
        previewBox.style.display="block";
        toast("编码完成，已下载PNG");
    }catch(e){
        toast("编码错误："+e.message,true);
        console.error(e);
    }finally{
        btnEncode.disabled=false;
    }
};

btnDecode.onclick=async ()=>{
    const file = decFile.files[0];
    if(!file) return toast("请选择png图片",true);
    btnDecode.disabled=true;
    toast("正在解码");
    try{
        const img=new Image();
        await new Promise((res,rej)=>{
            img.onload=res;img.onerror=rej;
            img.src=URL.createObjectURL(file);
        });
        const w=img.width;
        const h=img.height;
        mCanvas.width=w;mCanvas.height=h;
        mCtx.drawImage(img,0,0);

        canvas.width=w;canvas.height=h;
        ctx.save();
        ctx.scale(-1,1);
        ctx.drawImage(mCanvas,-w,0,w,h);
        ctx.restore();

        const imgData = ctx.getImageData(0,0,w,h);
        const pixels = imgData.data;
        const totalPixel = pixels.length/4;
        const mode = getMode();

        const bitStream=[];
        for(let p=0;p<totalPixel;p++){
            const i=p*4;
            const r=pixels[i];
            const g=pixels[i+1];
            const b=pixels[i+2];
            bitStream.push(findIndex(r,g,b));
        }

        let outBytes=[];
        if(mode==="16"){
            for(let i=0;i+1<bitStream.length;i+=2){
                const hi=bitStream[i];
                const lo=bitStream[i+1];
                outBytes.push((hi<<4)|lo);
            }
        }else{
            const pad = bitStream[0];
            const stream = bitStream.slice(1);
            let acc=0;
            let bitCnt=0;
            for(const v of stream){
                acc = (acc <<6) | v;
                bitCnt +=6;
                while(bitCnt >=8){
                    bitCnt -=8;
                    outBytes.push( (acc >> bitCnt) & 0xFF );
                }
            }
            if(pad>0){
                outBytes.pop();
            }
        }

        const result = new Uint8Array(outBytes);
        const blob = new Blob([result]);
        const url = URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;
        a.download="recovered.bin";
        document.body.appendChild(a);
        a.click();
        a.remove();

        prevImg.src=img.src;
        previewBox.style.display="block";
        toast("解码完成，已输出恢复文件");
    }catch(e){
        toast("解码错误："+e.message,true);
        console.error(e);
    }finally{
        btnDecode.disabled=false;
    }
};
</script>
</body>
</html>
