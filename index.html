<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalCipher 图片载体编解码器</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
button:focus{
    outline:none !important;
}
body{
    min-height:100vh;
    background-color:#0f1117;
    color:#e5e7eb;
    padding:24px 16px;
}
.container{
    max-width:680px;
    margin:0 auto;
}
h1{
    font-size:24px;
    font-weight:600;
    margin-bottom:8px;
    text-align:center;
}
.subtitle{
    text-align:center;
    font-size:13px;
    color:#9ca3af;
    margin-bottom:16px;
}
.message{
    min-height:28px;
    margin-bottom:12px;
    text-align:center;
    color:#93c5fd;
    font-size:15px;
}
.warn{
    color:#f87171;
}
.card{
    background-color:#181b23;
    border:1px solid #272b35;
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
}
.card h3{
    font-size:17px;
    font-weight:500;
    margin-bottom:12px;
    color:#f3f4f6;
}

/*原生隐藏文件输入，不能display:none*/
.real-file{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    overflow:hidden;
}
.btn-blue{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#ffffff;
    font-size:15px;
    cursor:pointer;
    margin-bottom:10px;
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.btn-blue:hover:not(:disabled){
    background:#1d4ed8;
}
.btn-blue:disabled{
    background:#2d323d;
    color:#717885;
    cursor:not-allowed;
}

.radio-wrap{
    display:flex;
    gap:24px;
    margin-bottom:12px;
}
.radio-item{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
}
.preview-card{
    background:#121620;
    border:1px solid #2e3440;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
    max-height:400px;
    overflow:auto;
}
.preview-card img{
    max-width:100%;
}
@media(max-width:600px){
    h1{font-size:20px;}
    .card{padding:16px;}
}
</style>
</head>
<body>
<div class="container">
    <h1>LocalCipher 图片载体编解码器</h1>
    <div class="subtitle">16色/64色｜镜像→交换2&18行｜黑→白｜红→蓝｜保存原文件名</div>

    <div class="card">
        <h3>选择模式</h3>
        <div class="radio-wrap">
            <div class="radio-item">
                <input type="radio" name="mode" id="m16" value="16" checked>
                <label for="m16">16色 4bit（稳定优先）</label>
            </div>
            <div class="radio-item">
                <input type="radio" name="mode" id="m64" value="64">
                <label for="m64">64色 6bit（体积更小）</label>
            </div>
        </div>
        <div id="modeTip" style="font-size:13px;color:#aaa;"></div>
    </div>

    <div class="card">
        <h3>编码 文件转为PNG图片</h3>
        <input type="file" id="encFile" class="real-file">
        <label for="encFile" class="btn-blue" id="labelEnc">选择待编码文件</label>
        <button class="btn-blue" id="btnEncode">编码并下载PNG</button>
    </div>

    <div class="card">
        <h3>解码 PNG恢复原文件</h3>
        <input type="file" id="decFile" accept=".png" class="real-file">
        <label for="decFile" class="btn-blue" id="labelDec">选择PNG图片</label>
        <button class="btn-blue" id="btnDecode">解码恢复文件</button>
    </div>

    <div class="card">
        <h3>预览</h3>
        <div class="preview-card" id="previewBox" style="display:none;">
            <img id="prevImg">
        </div>
    </div>

    <div class="message" id="msg"></div>
</div>

<canvas id="workCanvas" style="display:none;"></canvas>
<canvas id="mirrorCanvas" style="display:none;"></canvas>
<canvas id="postCanvas" style="display:none;"></canvas>

<script>
const msgEl = document.getElementById('msg');
const previewBox = document.getElementById('previewBox');
const prevImg = document.getElementById('prevImg');

const postCanvas = document.getElementById('postCanvas');

const decFile = document.getElementById('decFile');
const labelEnc = document.getElementById('labelEnc');
const labelDec = document.getElementById('labelDec');
const btnEncode = document.getElementById('btnEncode');
const btnDecode = document.getElementById('btnDecode');

const TEXT_ENC_DEFAULT = "选择待编码文件";
const TEXT_DEC_DEFAULT = "选择PNG图片";

let palette = [];

function truncName(name, maxLen=22){
    if(name.length <= maxLen) return name;
    const ext = name.lastIndexOf('.');
    if(ext === -1) return name.slice(0,maxLen‑3)+'…';
    const suffix = name.slice(ext);
    return name.slice(0, maxLen‑suffix.length‑2)+'…'+suffix;
}

encFile.addEventListener('change',function(){
    if(this.files.length>0){
        labelEnc.textContent = truncName(this.files[0].name);
    }else{
        labelEnc.textContent = TEXT_ENC_DEFAULT;
    }
});
decFile.addEventListener('change',function(){
    if(this.files.length>0){
        labelDec.textContent = truncName(this.files[0].name);
    }else{
        labelDec.textContent = TEXT_DEC_DEFAULT;
    }
});

document.querySelectorAll('input[name="mode"]').forEach(r=>{
    r.addEventListener('change', updatePalette);
});

function getMode(){
    return document.querySelector('input[name="mode"]:checked').value;
}

function updatePalette(){
    const mode = getMode();
    palette = [];
    if(mode === "16"){
        for(let i=0;i<16;i++){
            const r = (i & 0b11) * 85;
            const g = ((i>>2)&0b11)*85;
            const b = 0;
            palette.push({r,g,b});
        }
        modeTip.textContent = "16色(4bit):无填充位，图片尺寸偏大";
    }else{
        for(let i=0;i<64;i++){
            const r = (i & 0b111)*36;
            const g = ((i>>3)&0b111)*36;
            const b = 0;
            palette.push({r,g,b});
        }
        modeTip.textContent = "64色(6bit):图片更小，存在少量末尾填充比特";
    }
}
updatePalette();

function toast(s,isWarn=false){
    msgEl.textContent=s;
    msgEl.className= isWarn?"message warn":"message";
}

function findIndex(r,g,b){
    let best=0;
    let minD=1e9;
    for(let i=0;i<palette.length;i++){
        const c=palette[i];
        const dr=r-c.r;
        const dg=g-c.g;
        const db=b-c.b;
        const dist = dr*dr+dg*dg+db*db;
        if(dist<minD){
            minD=dist;
            best=i;
        }
    }
    return best;
}

function buildPayloadBytes(filename,fileUint8){
    const nameBuf = new TextEncoder().encode(filename);
    const lenBuf = new Uint8Array(2);
    lenBuf[0] = nameBuf.length >> 8;
    lenBuf[1] = nameBuf.length & 0xff;
    const out = new Uint8Array(lenBuf.length + nameBuf.length + fileUint8.length);
    out.set(lenBuf,0);
    out.set(nameBuf, lenBuf.length);
    out.set(fileUint8, lenBuf.length + nameBuf.length);
    return out;
}

function parsePayloadBytes(rawBytes){
    const nameLen = (rawBytes[0] <<8) | rawBytes[1];
    const nameBuf = rawBytes.slice(2, 2+nameLen);
    const name = new TextDecoder().decode(nameBuf);
    const data = rawBytes.slice(2+nameLen);
    return {name,data};
}

function postProcessImage(sourceCanvas){
    const w = sourceCanvas.width;
    const h = sourceCanvas.height;
    postCanvas.width = w;
    postCanvas.height = h;
    postCtx.drawImage(sourceCanvas,0,0);

    postCtx.save();
    postCtx.translate(w,0);
    postCtx.scale(-1,1);
    postCtx.drawImage(sourceCanvas,0,0);
    postCtx.restore();

    let imgData = postCtx.getImageData(0,0,w,h);
    const data = imgData.data;
    const y1 = 1;
    const y2 = 17;
    if(h>y2){
        const row1 = new Uint8ClampedArray(w*4);
        const row2 = new Uint8ClampedArray(w*4);
        row1.set(data.subarray(y1*w*4, (y1+1)*w*4));
        row2.set(data.subarray(y2*w*4, (y2+1)*w*4));
        data.set(row2, y1*w*4);
        data.set(row1, y2*w*4);
    }

    for(let i=0;i<data.length;i+=4){
        let r=data[i],g=data[i+1],b=data[i+2];
        if(r===0&&g===0&&b===0){
            data[i]=255;data[i+1]=255;data[i+2]=255;
        }
        if(r>120 && g<60 && b<60){
            data[i]=0;data[i+1]=0;data[i+2]=255;
        }
    }
    postCtx.putImageData(imgData,0,0);
    return postCanvas;
}
