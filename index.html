<!DOCTYPE html>
<html>
<head>
<style>
#lab{
  display:block;
  background:#2563eb;
  color:white;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}
#f{
  position:absolute;
  opacity:0;
}
</style>
</head>
<body>
<div id="out">未选择</div>
<input type="file" id="f">
<label for="f" id="lab">点我选择文件</label>

<script>
const fi=document.getElementById("f");
const out=document.getElementById("out");
fi.onchange=function(){
  if(fi.files.length>0){
    out.innerText=fi.files[0].name;
  }else{
    out.innerText="取消选择";
  }
}
</script>
</body>
</html>
