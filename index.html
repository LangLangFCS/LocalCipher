<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalCipher 16色 standalone</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui, sans-serif;
}
body{
  max-width:900px;
  margin:0 auto;
  padding:16px;
  background:#f7f8fa;
  color:#1f2937;
}
h1{
  text-align:center;
  margin-bottom:24px;
  font-size:22px;
}
.panel{
  background:#fff;
  border-radius:12px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 1px 3px #0000001a;
}
.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
.item{
  flex:1;
  min-width:220px;
}
button, label.btn{
  width:100%;
  padding:12px 14px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:999px;
  font-size:15px;
  cursor:pointer;
  transition:background 0.2s;
  display:block;
  text-align:center;
}
button:disabled{
  background:#94a3b8;
  cursor:not-allowed;
}
label.btn:hover:not(:has(input:disabled)){
  background:#1d4ed8;
}
input[type="file"]{
  display:none;
}
.info{
  margin-top:12px;
  font-size:13px;
  color:#4b5563;
}
.warn{
  color:#dc2626;
  font-size:13px;
  margin-top:8px;
}
</style>
</head>
<body>
<h1>LocalCipher 16色编解码器</h1>

<div class="panel">
  <h3>编码 文件 → 16c.png</h3>
  <div class="row">
    <div class="item">
      <label class="btn">
        选择待编码文件
        <input id="encFile" type="file"/>
      </label>
      <div class="info" id="encFileName">未选择文件</div>
    </div>
    <div class="item">
      <button id="encodeBtn">编码并下载 .16c.png</button>
    </div>
  </div>
  <div class="warn">⚠️只能使用浏览器下载原图，截图/QQ微信转发会损坏图片，解码乱码</div>
</div>

<div class="panel">
  <h3>解码 16c.png → 原始文件</h3>
  <div class="row">
    <div class="item">
      <label class="btn">
        选择编码PNG图片
        <input id="decFile" type="file" accept="image/png"/>
      </label>
      <div class="info" id="decFileName">未选择图片</div>
    </div>
    <div class="item">
      <button id="decodeBtn">解码恢复文件</button>
    </div>
  </div>
</div>

<script>
//16色完整调色板
const palette = [
  [0,0,0],        //0黑
  [255,0,0],      //1红
  [255,128,0],    //2橙
  [255,255,0],    //3黄
  [0,200,0],      //4绿
  [0,255,255],    //5青
  [0,80,255],     //6蓝
  [160,0,255],    //7紫
  [255,255,255],  //8白
  [64,64,64],     //9深灰
  [255,128,128],  //10浅红
  [255,220,128],  //11浅橙
  [255,255,160],  //12浅黄
  [128,240,128],  //13浅绿
  [128,255,255],  //14浅青
  [160,180,255]   //15浅蓝
];

//颜色转索引
function getColorIndex(r,g,b){
  let minDist=Infinity;
  let idx=0;
  for(let i=0;i<palette.length;i++){
    const [pr,pg,pb]=palette[i];
    const d=Math.abs(pr-r)+Math.abs(pg-g)+Math.abs(pb-b);
    if(d<minDist){
      minDist=d;
      idx=i;
    }
  }
  return idx;
}

//文件转Uint8Array
async function fileToArrayBuffer(file){
  return new Uint8Array(await file.arrayBuffer());
}

//计算正方形画布尺寸
function calcSquareSize(totalPixels){
  let s=Math.ceil(Math.sqrt(totalPixels));
  return s;
}

//编码
const encFile=document.getElementById('encFile');
const encFileName=document.getElementById('encFileName');
const encodeBtn=document.getElementById('encodeBtn');
let selectedEncFile=null;

encFile.onchange=e=>{
  selectedEncFile=e.target.files[0];
  encFileName.textContent=selectedEncFile?selectedEncFile.name:"未选择文件";
};

encodeBtn.onclick=async ()=>{
  if(!selectedEncFile) return alert("请先选择文件");
  encodeBtn.disabled=true;
  encodeBtn.textContent="正在编码...";
  try{
    const raw=await fileToArrayBuffer(selectedEncFile);
    const fileNameBytes=new TextEncoder().encode(selectedEncFile.name);
    //元数据：4字节真实数据长度 + 2字节文件名长度 +文件名字节 +原始文件数据
    const meta=new Uint8Array(4+2+fileNameBytes.length+raw.length);
    const dv=new DataView(meta.buffer);
    dv.setUint32(0,raw.length); //真实文件字节数，解决末尾乱码关键
    dv.setUint16(4,fileNameBytes.length);
    meta.set(fileNameBytes,6);
    meta.set(raw,6+fileNameBytes.length);

    //4bit，2字节存1个byte
    const totalBits=meta.length*8;
    const canvasPixelCount=Math.ceil(totalBits/4);
    const size=calcSquareSize(canvasPixelCount);
    const canvas=document.createElement("canvas");
    canvas.width=size;
    canvas.height=size;
    const ctx=canvas.getContext("2d");
    const imgData=ctx.createImageData(size,size);

    let bitPtr=0;
    for(let i=0;i<meta.length;i++){
      const b=meta[i];
      const high=(b>>4)&0x0f;
      const low=b&0x0f;
      //高4bit
      const [r1,g1,b1]=palette[high];
      const px1=bitPtr*4;
      imgData.data[px1]=r1;imgData.data[px1+1]=g1;imgData.data[px1+2]=b1;imgData.data[px1+3]=255;
      bitPtr++;
      //低4bit
      const [r2,g2,b2]=palette[low];
      const px2=bitPtr*4;
      imgData.data[px2]=r2;imgData.data[px2+1]=g2;imgData.data[px2+2]=b2;imgData.data[px2+3]=255;
      bitPtr++;
    }
    //填充剩余像素为0
    for(let i=bitPtr;i<size*size;i++){
      const px=i*4;
      imgData.data[px]=palette[0][0];
      imgData.data[px+1]=palette[0][1];
      imgData.data[px+2]=palette[0][2];
      imgData.data[px+3]=255;
    }
    //水平镜像翻转
    for(let y=0;y<size;y++){
      for(let x=0;x<Math.floor(size/2);x++){
        const leftIdx=(y*size+x)*4;
        const rightIdx=(y*size+(size-1-x))*4;
        for(let c=0;c<4;c++){
          const t=imgData.data[leftIdx+c];
          imgData.data[leftIdx+c]=imgData.data[rightIdx+c];
          imgData.data[rightIdx+c]=t;
        }
      }
    }
    ctx.putImageData(imgData,0,0);
    //下载
    const blob=await new Promise(res=>canvas.toBlob(res,"image/png"));
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=selectedEncFile.name+".16c.png";
    a.click();
    URL.revokeObjectURL(a.href);
  }catch(err){
    alert("编码失败："+err.message);
  }finally{
    encodeBtn.disabled=false;
    encodeBtn.textContent="编码并下载 .16c.png";
  }
};

//解码
const decFile=document.getElementById('decFile');
const decFileName=document.getElementById('decFileName');
const decodeBtn=document.getElementById('decodeBtn');
let selectedDecFile=null;

decFile.onchange=async e=>{
  selectedDecFile=e.target.files[0];
  decFileName.textContent=selectedDecFile?selectedDecFile.name:"未选择图片";
};

decodeBtn.onclick=async ()=>{
  if(!selectedDecFile) return alert("请选择 .16c.png");
  decodeBtn.disabled=true;
  decodeBtn.textContent="正在解码...";
  try{
    const imgBlob=await createImageBitmap(selectedDecFile);
    const canvas=document.createElement("canvas");
    canvas.width=imgBlob.width;
    canvas.height=imgBlob.height;
    const ctx=canvas.getContext("2d");
    ctx.drawImage(imgBlob,0,0);
    const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
    const size=canvas.width;

    //镜像复原
    for(let y=0;y<size;y++){
      for(let x=0;x<Math.floor(size/2);x++){
        const leftIdx=(y*size+x)*4;
        const rightIdx=(y*size+(size-1-x))*4;
        for(let c=0;c<4;c++){
          const t=imgData.data[leftIdx+c];
          imgData.data[leftIdx+c]=imgData.data[rightIdx+c];
          imgData.data[rightIdx+c]=t;
        }
      }
    }

    //读取像素，4bit恢复字节
    const totalPixels=size*size;
    const outBytes=[];
    for(let px=0;px<totalPixels;px+=2){
      const p1=px*4;
      const idxHigh=getColorIndex(imgData.data[p1],imgData.data[p1+1],imgData.data[p1+2]);
      const p2=(px+1)*4;
      const idxLow=getColorIndex(imgData.data[p2],imgData.data[p2+1],imgData.data[p2+2]);
      const byte=(idxHigh<<4)|idxLow;
      outBytes.push(byte);
    }
    const fullMeta=new Uint8Array(outBytes);
    const dv=new DataView(fullMeta.buffer);
    //读取元数据，拿到真实文件长度，**只读取对应字节，截断后面多余填充，消除末尾乱码问号**
    const realFileLen=dv.getUint32(0);
    const nameLen=dv.getUint16(4);
    const fileNameRaw=fullMeta.slice(6,6+nameLen);
    const originalFileName=new TextDecoder().decode(fileNameRaw);
    const realFileData=fullMeta.slice(6+nameLen,6+nameLen+realFileLen);

    //下载还原文件
    const blob=new Blob([realFileData]);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=originalFileName;
    a.click();
    URL.revokeObjectURL(a.href);
  }catch(err){
    alert("解码失败："+err.message);
  }finally{
    decodeBtn.disabled=false;
    decodeBtn.textContent="解码恢复文件";
  }
};
</script>
</body>
</html>
