<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalCipher 256色编解码器</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
body{
    min-height:100vh;
    background-color:#0f1117;
    color:#e5e7eb;
    padding:24px 16px;
}
.container{
    max-width:680px;
    margin:0 auto;
}
h1{
    font-size:26px;
    font-weight:600;
    margin-bottom:8px;
    text-align:center;
}
.subtitle{
    text-align:center;
    font-size:13px;
    color:#9ca3af;
    margin-bottom:12px;
}
.message{
    min-height:28px;
    margin-bottom:12px;
    text-align:center;
    color:#93c5fd;
    font-size:15px;
    font-weight:500;
}
.warn{
    color:#f87171;
}
.info{
    color:#60a5fa;
}
.card{
    background-color:#181b23;
    border:1px solid #272b35;
    border-radius:16px;
    padding:24px;
    margin-bottom:20px;
}
.card h3{
    font-size:18px;
    font-weight:500;
    margin-bottom:16px;
    color:#f3f4f6;
}
input[type="file"]{
    width:100%;
    padding:12px 14px;
    margin-bottom:14px;
    background:#21252e;
    border:1px solid #333844;
    border-radius:10px;
    color:#e5e7eb;
    font-size:15px;
}
input[type="file"]::file-selector-button {
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:6px;
    padding:8px 14px;
    cursor:pointer;
    margin-right:12px;
    transition:background 0.2s;
}
input[type="file"]::file-selector-button:hover {
    background:#1d4ed8;
}
button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#ffffff;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.2s;
    margin-bottom:10px;
}
button:hover:not(:disabled){
    background:#1d4ed8;
}
button:disabled{
    background:#2d323d;
    color:#717885;
    cursor:not-allowed;
}
.preview-card{
    background:#121620;
    border:1px solid #2e3440;
    border-radius:12px;
    padding:16px;
    margin-top:14px;
    max-height:420px;
    overflow:auto;
}
.preview-card img{
    max-width:100%;
}
@media(max-width:600px){
    h1{font-size:22px;}
    .card{padding:18px;}
}
</style>
</head>
<body>
<div class="container">
    <h1>LocalCipher 256色编解码器</h1>
    <div class="subtitle">文件转256色图片，水平镜像翻转，直接导出png</div>
    <div class="message" id="msg"></div>

    <div class="card">
        <h3>编码 文件转为PNG图片</h3>
        <input type="file" id="encFile">
        <button id="btnEncode">编码并下载PNG</button>
    </div>

    <div class="card">
        <h3>解码 PNG恢复原文件</h3>
        <input type="file" id="decFile" accept=".png">
        <button id="btnDecode">解码并恢复文件</button>
    </div>

    <div class="card">
        <h3>预览</h3>
        <div class="preview-card" id="previewBox" style="display:none;">
            <img id="prevImg">
        </div>
    </div>
</div>

<canvas id="workCanvas" style="display:none;"></canvas>
<canvas id="mirrorCanvas" style="display:none;"></canvas>

<script>
const msgEl = document.getElementById('msg');
const previewBox = document.getElementById('previewBox');
const prevImg = document.getElementById('prevImg');
const canvas = document.getElementById('workCanvas');
const ctx = canvas.getContext('2d');
const mCanvas = document.getElementById('mirrorCanvas');
const mCtx = mCanvas.getContext('2d');

const encFile = document.getElementById('encFile');
const decFile = document.getElementById('decFile');
const btnEncode = document.getElementById('btnEncode');
const btnDecode = document.getElementById('btnDecode');

//生成256色调色板
const palette256 = [];
for(let i=0;i<256;i++){
    const r = i & 0x07;
    const g = (i >> 3) & 0x07;
    const b = (i >> 6) & 0x03;
    palette256.push(`rgb(${r*36},${g*36},${b*85})`);
}

function findPaletteIndex(r,g,b){
    let best=0;
    let minD=1e9;
    for(let i=0;i<256;i++){
        const color = palette256[i];
        const m = color.match(/rgb\((\d+),(\d+),(\d+)\)/);
        const cr = Number(m[1]);
        const cg = Number(m[2]);
        const cb = Number(m[3]);
        const dr=r-cr;
        const dg=g-cg;
        const db=b-cb;
        const dist=dr*dr+dg*dg+db*db;
        if(dist<minD){
            minD=dist;
            best=i;
        }
    }
    return best;
}

function toast(s,isWarn=false){
    msgEl.textContent=s;
    msgEl.className= isWarn?"message warn":"message info";
    void msgEl.offsetHeight;
}

//编码
btnEncode.onclick=async ()=>{
    const file=encFile.files[0];
    if(!file) return toast("请选择文件",true);
    btnEncode.disabled=true;
    toast("正在编码");
    try{
        const arrBuf=await file.arrayBuffer();
        const bytes=new Uint8Array(arrBuf);
        const totalPix = bytes.length;
        const side = Math.ceil(Math.sqrt(totalPix));

        canvas.width=side;
        canvas.height=side;
        ctx.clearRect(0,0,side,side);

        for(let idx=0;idx<totalPix;idx++){
            const x=idx%side;
            const y=Math.floor(idx/side);
            const val = bytes[idx];
            ctx.fillStyle = palette256[val];
            ctx.fillRect(x,y,1,1);
        }

        //水平镜像翻转
        mCanvas.width=side; mCanvas.height=side;
        mCtx.save();
        mCtx.scale(-1,1);
        mCtx.drawImage(canvas,-side,0,side,side);
        mCtx.restore();

        const blob=await new Promise(res=>mCanvas.toBlob(res,"image/png"));
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download=file.name+".256color.png";
        document.body.appendChild(a);
        a.click();
        a.remove();

        prevImg.src=url;
        previewBox.style.display="block";
        toast("编码完成，已下载png图片");
    }catch(e){
        toast("编码错误: "+e.message,true);
        console.error(e);
    }finally{
        btnEncode.disabled=false;
    }
};

//解码，直接导入png图片
btnDecode.onclick=async ()=>{
    const file=decFile.files[0];
    if(!file) return toast("请选择生成的png图片",true);
    btnDecode.disabled=true;
    toast("正在解码");
    try{
        const img=new Image();
        await new Promise((res,rej)=>{
            img.onload=res; img.onerror=rej;
            img.src=URL.createObjectURL(file);
        });
        const w=img.width;
        const h=img.height;
        mCanvas.width=w; mCanvas.height=h;
        mCtx.drawImage(img,0,0);

        //镜像复原
        canvas.width=w; canvas.height=h;
        ctx.save();
        ctx.scale(-1,1);
        ctx.drawImage(mCanvas,-w,0,w,h);
        ctx.restore();

        const imgData=ctx.getImageData(0,0,w,h);
        const pixels=imgData.data;
        const outBytes=[];
        for(let i=0;i<pixels.length;i+=4){
            const r=pixels[i];
            const g=pixels[i+1];
            const b=pixels[i+2];
            const idx=findPaletteIndex(r,g,b);
            outBytes.push(idx);
        }

        //去除画布填充多余像素，实际有效数据为正方形内全部，但是无法记录原始长度
        //注意：本方案没有元数据，解码输出会包含画布补齐的多余像素
        const resultBytes=new Uint8Array(outBytes);
        const outBlob=new Blob([resultBytes]);
        const url=URL.createObjectURL(outBlob);
        const a=document.createElement("a");
        a.href=url;
        a.download="recovered.bin";
        document.body.appendChild(a);
        a.click();
        a.remove();

        prevImg.src=img.src;
        previewBox.style.display="block";
        toast("解码完成，已输出恢复文件");
    }catch(e){
        toast("解码错误: "+e.message,true);
        console.error(e);
    }finally{
        btnDecode.disabled=false;
    }
};
</script>
</body>
</html>
